plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'de.thisisfel1x'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

fabricApi {
    configureTests {
        // Only client gametests (icon exporter, end-to-end test) are needed, no server gametests
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Paths are relative to the repository root, so the export lands directly in the plugin's resource pack sources
def repositoryRoot = rootDir.parentFile.parentFile

// Which client test runs: 'icons' (default, IconExporterGameTest) or 'e2e' (ServerEndToEndGameTest, started by
// tools/smoke-test/e2e_test.py together with a Paper server: -PclientTest=e2e -Pe2eServer=host:port)
def clientTest = (project.findProperty('clientTest') ?: 'icons') as String
// A game needs two players: the end-to-end test runs a second client (-Pe2eRole=secondary) in parallel, with its
// own run directory and user name
def e2eRole = (project.findProperty('e2eRole') ?: 'primary') as String

loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
    vmArg "-Dfib.test=${clientTest}"
    vmArg "-Dfib.e2e.server=${project.findProperty('e2eServer') ?: ''}"
    vmArg "-Dfib.e2e.role=${e2eRole}"
    vmArg "-Dfib.e2e.output=${layout.buildDirectory.dir('e2e-test').get().asFile.absolutePath}"
    // The two clients send different languages - the plugin has to answer each in its own
    vmArg "-Dfib.e2e.language=${e2eRole == 'secondary' ? 'de_de' : 'en_us'}"
    // Fixed names: e2e_test.py makes both operators (ops.json, offline UUIDs) for the settings item
    if (e2eRole == 'secondary') {
        runDir = 'build/run/clientGameTest-secondary'
        programArguments.set(['--username', 'Player1'])
    } else {
        programArguments.set(['--username', 'Player0'])
    }
    vmArg "-Dfib.icons.dir=${new File(repositoryRoot, 'resourcepack/icons').absolutePath}"
    vmArg "-Dfib.icons.manifest=${new File(repositoryRoot, 'resourcepack/icons.json').absolutePath}"
    vmArg "-Dfib.icons.preview=${layout.buildDirectory.dir('icon-preview').get().asFile.absolutePath}"
    vmArg "-Dfib.icons.scale=${project.findProperty('iconScale') ?: 4}"
    vmArg "-Dfib.icons.previewSize=${project.findProperty('previewIconSize') ?: 32}"
    // Known issue of client gametests on GitHub Actions (see Fabric docs "Automatic Testing")
    vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// On CI Loom wraps the client in its own xvfb-run with the default screen (no 24 bit visual): OpenGL then fails with
// "Couldn't find matching GLX visual" and the game falls back to Vulkan (lavapipe), which crashes on exit.
// The workflows start Gradle inside xvfb-run with a 24 bit screen, the client uses that display
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
    useXvfb = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [version: project.version, minecraftVersion: project.minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}
