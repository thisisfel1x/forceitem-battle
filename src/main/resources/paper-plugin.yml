name: forceitem-battle
version: '${version}'
main: de.thisisfel1x.forceitembattle.ForceItemBattle
# Runs before the worlds are loaded: registers the data pack for the biome size (world.biome-size)
bootstrapper: de.thisisfel1x.forceitembattle.ForceItemBattleBootstrap
api-version: '${apiVersion}'
authors: [ thisisfel1x ]

permissions:
  forceitembattle.start:
    description: Allows starting the game with /start
    default: op
  forceitembattle.settings:
    description: Allows changing the game settings in the lobby
    default: op
