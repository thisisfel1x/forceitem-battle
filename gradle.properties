version=1.2.0

# Every Minecraft (Paper) version the plugin is released for - comma separated, ascending.
#   - the first entry is the minimum: the jar is compiled against its API, plugin.yml gets it as api-version
#     and the bytecode targets its Java version (1.21.x -> 21, 26.x -> 25), so one jar runs on all of them
#   - the last entry is the newest: default for runServer, icons are expected for it
#   - CI compiles against and smoke tests every entry, the release lists all of them on Modrinth
# New versions are added by the "New Minecraft version" workflow.
supportedVersions=1.21.11,26.1.1,26.1.2,26.2,26.3

# Resource pack format range (pack.mcmeta min_format/max_format): format of the oldest and of the newest
# supported version. Taken from the version.json of the Minecraft client jar.
resourcePackMinFormat=75
resourcePackMaxFormat=97

# GitHub repository (owner/name) - the default resource pack URL points to its releases
githubRepository=thisisfel1x/forceitem-battle

# Edge length of the item icons inside the resource pack (the exporter renders 64px masters)
resourcePackIconSize=32
