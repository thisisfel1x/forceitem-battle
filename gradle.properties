version=1.1.0

# Paper / Minecraft version the plugin is built for. Also used by the release workflow (Modrinth game version).
paperVersion=26.3

# GitHub repository (owner/name) - the default resource pack URL points to its releases
githubRepository=thisisfel1x/forceitem-battle

# Edge length of the item icons inside the resource pack (the exporter renders 64px masters)
resourcePackIconSize=32
# Only used while resourcepack/icons.json does not exist yet
resourcePackFormat=97
