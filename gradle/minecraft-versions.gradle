/*
 * Supported Minecraft versions (gradle.properties -> supportedVersions) and helpers around them.
 *
 *   ./gradlew build                              jar for all versions, compiled against the oldest API
 *   ./gradlew compileJava -PcompileVersion=26.2  compatibility check against another supported API
 *   ./gradlew runServer -PtestVersion=26.1.2     local test server of a specific version
 */

def supportedVersions = (findProperty('supportedVersions') ?: '')
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

if (supportedVersions.isEmpty()) {
    throw new GradleException('gradle.properties: supportedVersions is empty')
}

def minimumVersion = supportedVersions.first()
def latestVersion = supportedVersions.last()

def compileVersion = (findProperty('compileVersion') ?: minimumVersion) as String
if (!supportedVersions.contains(compileVersion)) {
    logger.warn("compileVersion ${compileVersion} is not listed in supportedVersions")
}

ext.minecraftVersions = [
        supported: supportedVersions,
        minimum  : minimumVersion,
        latest   : latestVersion,
        compile  : compileVersion,
        // Server for runServer
        test     : (findProperty('testVersion') ?: latestVersion) as String,
]

/** Paper API coordinates: 1.x versions are SNAPSHOTs, since 26.x Paper publishes builds per version. */
ext.paperApiDependency = { String minecraftVersion ->
    minecraftVersion.startsWith('1.')
            ? "io.papermc.paper:paper-api:${minecraftVersion}-R0.1-SNAPSHOT"
            : "io.papermc.paper:paper-api:${minecraftVersion}.build.+"
}

/** Java version required by a Minecraft version (and the bytecode level its API is compiled with). */
ext.javaVersionFor = { String minecraftVersion ->
    minecraftVersion.startsWith('1.') ? 21 : 25
}
