name: Virtual display
description: >
  Installs xvfb and Mesa software rendering, so the Minecraft client (icon exporter, end-to-end test) runs
  without a GPU. Run the client with: LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_FORCE_EGL=1 xvfb-run --auto-servernum
  --server-args="-screen 0 2560x1440x24" <command>

runs:
  using: composite
  steps:
    - name: Install virtual display and software rendering
      shell: bash
      run: |
        # Retries: the Ubuntu mirrors answer with 503 now and then
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y xvfb libgl1-mesa-dri libegl1 libvulkan1 mesa-vulkan-drivers
