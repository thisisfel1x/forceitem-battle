name: Release

# Publishes a release to GitHub and Modrinth when a version tag is pushed.
#
#   1. Set the new version in gradle.properties (e.g. version=1.1.0) and merge it to master
#   2. git tag v1.1.0 && git push origin v1.1.0
#
# Tags with a suffix (e.g. v1.2.0-beta.1) are published as pre-release / beta.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MINECRAFT_VERSION: '26.3'
  MODRINTH_PROJECT: 'awKBElnR'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$PROJECT_VERSION in gradle.properties"
            exit 1
          fi

          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PROJECT_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'ForceItemBattle ${{ steps.version.outputs.version }}'
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/forceitem-battle-${{ steps.version.outputs.version }}.jar

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ env.MODRINTH_PROJECT }}
          name: 'ForceItemBattle ${{ steps.version.outputs.version }}'
          version: ${{ steps.version.outputs.version }}
          channel: ${{ steps.version.outputs.channel }}
          changelog: 'https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}'
          loaders: |-
            paper
          game-versions: |-
            ${{ env.MINECRAFT_VERSION }}
          files: build/libs/forceitem-battle-${{ steps.version.outputs.version }}.jar
