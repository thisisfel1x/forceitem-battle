name: New Minecraft version

# Checks daily whether Paper released a stable build for a new Minecraft version. If so:
#   1. tools/minecraft-update/minecraft_update.py adds it to supportedVersions, raises the resource pack format,
#      bumps the plugin version and points the icon exporter to the new version (if Fabric supports it already)
#   2. the item icons are rendered with the new client (artifact "icon-preview" contains screenshots)
#   3. a pull request "Support Minecraft <version>" is opened on branch minecraft/<version>
#   4. build.yml verifies the branch: compile + smoke test for every supported version incl. the new one
# Merging the pull request publishes the release to GitHub and Modrinth (release.yml).
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# Optional: a secret AUTOMATION_TOKEN (fine-grained PAT: contents + pull requests write) - pull requests
# opened with the default token do not trigger other workflows, so build.yml would not run as PR check
# (step 4 covers that within this workflow anyway).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      versions:
        description: Versions to add, space separated (default - detect new stable Paper versions)
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect new versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      branch: ${{ steps.detect.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect new Minecraft versions
        id: detect
        env:
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          if [ -n "$INPUT_VERSIONS" ]; then
            VERSIONS="$INPUT_VERSIONS"
          else
            VERSIONS="$(python3 tools/minecraft-update/minecraft_update.py detect)"
          fi

          if [ -z "$VERSIONS" ]; then
            echo "No new Minecraft version with a stable Paper build."
            exit 0
          fi

          LATEST="$(echo "$VERSIONS" | awk '{print $NF}')"
          BRANCH="minecraft/$LATEST"
          # An open pull request may contain manual fixes - never overwrite it
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH exists already, nothing to do."
            exit 0
          fi

          echo "New versions: $VERSIONS"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  update:
    name: Prepare pull request
    needs: detect
    if: needs.detect.outputs.versions != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add versions to the build
        id: apply
        env:
          VERSIONS: ${{ needs.detect.outputs.versions }}
        run: python3 tools/minecraft-update/minecraft_update.py apply $VERSIONS --summary build/minecraft-update.md

      - name: Render item icons
        id: icons
        if: steps.apply.outputs.fabric == 'true'
        continue-on-error: true
        uses: ./.github/actions/render-icons

      - name: Write pull request description
        env:
          FABRIC: ${{ steps.apply.outputs.fabric }}
          ICONS: ${{ steps.icons.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ steps.apply.outputs.version }}
        run: |
          {
            cat build/minecraft-update.md
            echo
            if [ "$FABRIC" != "true" ]; then
              echo "Item icons were **not** regenerated (Fabric does not support the version yet)."
            elif [ "$ICONS" != "success" ]; then
              echo ":warning: Rendering the item icons **failed** - the previous icons are kept. The exporter"
              echo "(tools/icon-exporter) probably needs an update for the new version, see the logs in the artifact."
            else
              echo "Item icons regenerated - preview screenshots: artifact **icon-preview** of the [workflow run]($RUN_URL)."
            fi
            echo
            echo "Compile and smoke test results for every supported version: [workflow run]($RUN_URL), job *Verify*."
            echo
            echo "**Merging this pull request publishes version $VERSION to GitHub and Modrinth.**"
          } > build/pr-body.md

          if [ "$FABRIC" = "true" ] && [ "$ICONS" != "success" ]; then
            # The exporter clears the icon directory first - keep the previous icons
            git checkout -- resourcepack/icons resourcepack/icons.json
            git clean -fdq resourcepack/icons
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          branch: ${{ needs.detect.outputs.branch }}
          add-paths: |
            gradle.properties
            tools/icon-exporter/gradle.properties
            resourcepack/icons
            resourcepack/icons.json
          commit-message: 'feat: support Minecraft ${{ needs.detect.outputs.versions }}'
          title: 'Support Minecraft ${{ steps.apply.outputs.latest }}'
          body-path: build/pr-body.md
          delete-branch: true

  verify:
    name: Verify
    needs: [detect, update]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.detect.outputs.branch }}
