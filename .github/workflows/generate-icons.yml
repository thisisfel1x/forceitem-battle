name: Generate item icons

# Renders every item of the Minecraft version in tools/icon-exporter/gradle.properties with the real
# game client - headless on a virtual display (xvfb) with Mesa software rendering, no GPU and no
# Minecraft account needed - and opens a pull request with the new icons.
#
# New Minecraft versions are handled by new-minecraft-version.yml (which renders the icons itself).
# This workflow is for changes to the exporter: it runs automatically when the exporter changes and can be
# started manually (Actions -> Generate item icons -> Run workflow; manual runs need this file on the
# default branch). The artifact "icon-preview" contains screenshots of the icons in the boss bar.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests"
on:
  workflow_dispatch:
  push:
    branches-ignore:
      # Branches of the automation, they render the icons themselves
      - 'minecraft/**'
      - 'icons/**'
    paths:
      - 'tools/icon-exporter/**'
      - '.github/actions/render-icons/**'
      - '.github/actions/virtual-display/**'
      - '.github/workflows/generate-icons.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Minecraft version
        id: minecraft
        run: echo "version=$(grep -E '^minecraft_version=' tools/icon-exporter/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Render item icons
        uses: ./.github/actions/render-icons

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: icons/minecraft-${{ steps.minecraft.outputs.version }}
          add-paths: |
            resourcepack/icons
            resourcepack/icons.json
          commit-message: 'chore(icons): regenerate item icons for Minecraft ${{ steps.minecraft.outputs.version }}'
          title: 'Item icons for Minecraft ${{ steps.minecraft.outputs.version }}'
          body: |
            Item icons rendered by `tools/icon-exporter` with the Minecraft ${{ steps.minecraft.outputs.version }} client.

            Preview screenshots (sprite vs. font, real boss bars): artifact **icon-preview** of
            [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          delete-branch: true
