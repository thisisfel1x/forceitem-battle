name: Generate item icons

# Renders every item of the Minecraft version in tools/icon-exporter/gradle.properties with the real
# game client - headless on a virtual display (xvfb) with Mesa software rendering, no GPU and no
# Minecraft account needed - and opens a pull request with the new icons.
#
# Runs automatically when the exporter changes (e.g. a version bump in tools/icon-exporter/gradle.properties)
# and can be started manually (Actions -> Generate item icons -> Run workflow; manual runs need this file
# on the default branch). The artifact "icon-preview" contains screenshots of the icons in the boss bar.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests"
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/icon-exporter/**'
      - '.github/workflows/generate-icons.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libvulkan1 mesa-vulkan-drivers

      - name: Read Minecraft version
        id: minecraft
        run: echo "version=$(grep -E '^minecraft_version=' tools/icon-exporter/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Render item icons
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1440x24" \
            ./gradlew -p tools/icon-exporter runClientGameTest --no-daemon

      - name: Upload preview and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: |
            tools/icon-exporter/build/icon-preview
            tools/icon-exporter/build/run/clientGameTest/logs
          if-no-files-found: warn

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: icons/minecraft-${{ steps.minecraft.outputs.version }}
          add-paths: |
            resourcepack/icons
            resourcepack/icons.json
          commit-message: 'chore(icons): regenerate item icons for Minecraft ${{ steps.minecraft.outputs.version }}'
          title: 'Item icons for Minecraft ${{ steps.minecraft.outputs.version }}'
          body: |
            Item icons rendered by `tools/icon-exporter` with the Minecraft ${{ steps.minecraft.outputs.version }} client.

            Preview screenshots (sprite vs. font, real boss bars): artifact **icon-preview** of
            [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          delete-branch: true
