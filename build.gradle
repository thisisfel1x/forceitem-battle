import xyz.jpenilla.runtask.task.AbstractRun

plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'de.thisisfel1x'
// 'version' and 'paperVersion' are defined in gradle.properties (single source of truth for jar, plugin.yml and releases)

def targetJavaVersion = 25
def scoreboardLibraryVersion = '2.8.3'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Paper already ships Adventure (incl. MiniMessage), Gson and SnakeYAML - nothing of that is shaded.
    compileOnly("io.papermc.paper:paper-api:${paperVersion}.build.+")

    // The only shaded (and relocated) dependency
    implementation("net.megavex:scoreboard-library-api:${scoreboardLibraryVersion}")
    runtimeOnly("net.megavex:scoreboard-library-implementation:${scoreboardLibraryVersion}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
    options.compilerArgs.add('-Xlint:deprecation')
}

processResources {
    def props = [version: version, apiVersion: paperVersion]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// The shaded jar is the one and only artifact: build/libs/forceitem-battle-<version>.jar
jar {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    relocate('net.megavex.scoreboardlibrary', 'de.thisisfel1x.forceitembattle.libs.scoreboardlibrary')
}

assemble {
    dependsOn shadowJar
}

apply from: 'gradle/resourcepack.gradle'

tasks {
    runServer {
        minecraftVersion(paperVersion)
    }
}

// Local dev server only: JetBrains Runtime allows hot swapping with enhanced class redefinition
tasks.withType(AbstractRun).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        vendor = JvmVendorSpec.JETBRAINS
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    jvmArgs('-XX:+AllowEnhancedClassRedefinition')
}
